version: "3.9"

services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./napcat/config:/usr/share/nqq
      - ./napcat/log:/app/log
      - ./napcat/qq_data:/app/.config/QQ    # 持久化 QQ session，重启不需重新扫码
    environment:
      - WEB_UI_PORT=6099
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ops-bot:
    build: .
    image: ops-bot:latest
    container_name: ops-bot
    restart: unless-stopped
    env_file: .env
    environment:
      - HTTP_PROXY=
      - http_proxy=
      - all_proxy=
      - ALL_PROXY=
      - HTTPS_PROXY=http://127.0.0.1:10809
      - https_proxy=http://127.0.0.1:10809
    volumes:
      - ./config:/app/config:ro   # 生产配置（只读挂载）
      - ./logs:/app/logs           # 日志持久化
    network_mode: host             # 需要访问同机 QQ Bot 后端（WebSocket）
    healthcheck:
      # os.kill(1, 0) 检查主进程存活，无需额外安装 procps
      test: ["CMD", "python3", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
