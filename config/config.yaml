# ╔══════════════════════════════════════════════════════════╗
# ║              Personal Ops Bot — 主配置文件               ║
# ╚══════════════════════════════════════════════════════════╝

# ── 用户白名单 ────────────────────────────────────────────────
# 只有白名单内的用户才能发送命令
allowed_users:
  telegram:
    - "YOUR_TELEGRAM_USER_ID"    # 发 /start 后在 docker logs 里找
  qq:
    - "YOUR_QQ_NUMBER"           # 你的 QQ 号

# ── 允许重启的服务白名单 ──────────────────────────────────────
# /restart 命令只能操作此列表内的服务，防止误操作
allowed_services:
  - xray
  - hysteria-server
  - nginx
  - codex

# ── 目标节点 ──────────────────────────────────────────────────
# 每个节点对应一台 VPS，bot 通过 HTTP Agent API 操作
nodes:
  vps1:
    host: "${VPS1_HOST}"              # VPS 公网 IP（填入 .env）
    port: 9000                # Agent 监听端口
    token: "${VPS1_AGENT_TOKEN}"         # 从 .env 读取
    label: "ACCK_JP_VPS"      # 显示名称（用于消息推送）
    services: [xray, hysteria-server]  # 该节点运行的服务列表
    # ── 元数据（用于 /info 展示和告警） ──
    location: "日本 东京"
    purpose: "主代理节点"
    expire_date: "2028-01-11"  # 到期日，格式 YYYY-MM-DD；留空则不提醒
    monthly_traffic_gb: 1000   # 月流量上限（GB），0 表示不限制
    monthly_reset_day: 1       # 每月几号重置流量统计

  vps2:
    host: "${VPS2_HOST}"
    port: 9000
    token: "${VPS2_AGENT_TOKEN}"         # 从 .env 读取
    label: "dedirock_LA_VPS"
    services: [nginx, xray, hysteria-server, codex]
    # ── 元数据 ──
    location: "美国 洛杉矶"
    purpose: "备用节点"                # 留空则 /info 不显示此行
    expire_date: "2027-04-26"            # 留空则不推送到期提醒
    monthly_traffic_gb: 1000      # 0 = 不限制，不显示流量行
    monthly_reset_day: 27

# ── 日志 ──────────────────────────────────────────────────────
log_lines: 50   # /log 命令默认返回的日志行数

# ── AI（预留，当前 AI 功能由 OpenClaw 处理）──────────────────
ai:
  provider: anthropic
  model: claude-haiku-4-5-20251001
  max_tokens: 1000
