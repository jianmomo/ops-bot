# ══════════════════════════════════════════════════════
#  AI API 切换配置
#  git pull 后只需填 default_api_key 和 default_base_url
# ══════════════════════════════════════════════════════

# 中转站全局默认（所有 profile 共用，除非 profile 里单独覆盖）
default_api_key:  ""                          # ← 填入中转站 API Key
default_base_url: ""                          # ← 填入中转站地址，如 https://api.example.com/v1

# ── 模型列表 ───────────────────────────────────────────
# model   : 中转站实际模型名（填中转站文档里的名字）
# provider: 协议前缀，写入 openclaw 的 "provider/model"
#           中转站一般填 openai；直连 Anthropic 填 anthropic
# api_key / base_url: 可选，有独立账号时单独覆盖全局默认
profiles:

  # ── OpenAI ────────────────────────────────────────
  - name: "GPT-4o"
    model: "gpt-4o"
    provider: "openai"

  - name: "GPT-4o mini"
    model: "gpt-4o-mini"
    provider: "openai"

  - name: "o3-mini"
    model: "o3-mini"
    provider: "openai"

  # ── Claude ────────────────────────────────────────
  - name: "Claude Sonnet 4.5"
    model: "claude-sonnet-4-5-20251001"
    provider: "openai"                        # 中转站用 openai 协议

  - name: "Claude Haiku 4.5"
    model: "claude-haiku-4-5-20251001"
    provider: "openai"

  - name: "Claude Opus 4"
    model: "claude-opus-4-5"
    provider: "openai"

  # ── DeepSeek ──────────────────────────────────────
  - name: "DeepSeek V3"
    model: "deepseek-v3"
    provider: "openai"

  - name: "DeepSeek R1"
    model: "deepseek-r1"
    provider: "openai"

  # ── Gemini ────────────────────────────────────────
  - name: "Gemini 2.0 Flash"
    model: "gemini-2.0-flash"
    provider: "openai"

  - name: "Gemini 2.5 Pro"
    model: "gemini-2.5-pro"
    provider: "openai"

  # ── 直连示例（独立密钥，取消注释后使用）──────────
  # - name: "DeepSeek 官方直连"
  #   model: "deepseek-chat"
  #   provider: "openai"
  #   api_key:  ""                            # 官方 API Key
  #   base_url: "https://api.deepseek.com/v1"
