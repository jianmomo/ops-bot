enabled: true
interval: 60        # 轮询间隔（秒）
cooldown: 1800      # 同一告警重复推送冷却（秒）

# ── 资源阈值 ──────────────────────────────────────────────────
thresholds:
  cpu_percent: 80
  mem_percent: 80
  disk_percent: 80

# ── 到期提醒 ──────────────────────────────────────────────────
expire_remind_days: [7, 3, 1]   # 提前几天提醒到期

# ── 流量预警 ──────────────────────────────────────────────────
traffic_warn_percent: 80        # 月流量使用超过此百分比告警

# ── DDoS/流量异常检测 ─────────────────────────────────────────
ddos_threshold_mbps: 100        # 入站流量超过此值（Mbps）视为异常

# ── GFW 封锁检测 ──────────────────────────────────────────────
gfw_check_interval: 3600        # 检测间隔（秒）
gfw_check_timeout: 10           # 连接超时（秒）

# ── 监控节点列表 ──────────────────────────────────────────────
nodes:
  - vps1
  - vps2

# ── 网站可用性监控 ────────────────────────────────────────────
websites:
  enabled: true
  interval: 60
  timeout: 10
  sites:
    - name: "Trilium"
      url: "http://173.254.213.77:8080"
    - name: "VPS面板"
      url: "http://173.254.213.77:54321"
